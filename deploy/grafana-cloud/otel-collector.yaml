# Crudmates Observe — Grafana Cloud, SINGLE INSTANCE.
#
# Start here. One collector, managed backends, no Tempo/Mimir/Loki/Grafana to
# run. This is both the local try-out config (run it on a laptop, point apps
# at localhost:4318) and a valid cluster config at ONE replica.
#
# SINGLE INSTANCE ONLY. `tail_sampling` buffers a trace until it has every
# span, so it is correct in one process and silently wrong at 2+ replicas
# behind a round-robin Service, where each replica decides on a fragment.
# Scaling out is the gateway/sampler pair in this directory - the backend is
# managed either way, the constraint is the collector's, not Grafana's.
#
# Credentials (Grafana Cloud console → Connections → OTLP):
#   GRAFANA_CLOUD_OTLP_ENDPOINT   https://otlp-gateway-prod-<region>.grafana.net/otlp
#   GRAFANA_CLOUD_INSTANCE_ID     numeric stack id, used as the basic-auth username
#   GRAFANA_CLOUD_API_TOKEN       token with metrics/logs/traces write scope
#
# Run locally:
#   docker run --rm -p 4317:4317 -p 4318:4318 \
#     -e GRAFANA_CLOUD_OTLP_ENDPOINT -e GRAFANA_CLOUD_INSTANCE_ID -e GRAFANA_CLOUD_API_TOKEN \
#     -v "$(pwd)/deploy/grafana-cloud/otel-collector.yaml:/etc/otelcol/config.yaml:ro" \
#     otel/opentelemetry-collector-contrib:latest \
#     --config=/etc/otelcol/config.yaml

extensions:
  # Grafana Cloud authenticates OTLP with HTTP basic auth: the stack's numeric
  # instance ID as username, an API token as password.
  basicauth/grafana_cloud:
    client_auth:
      username: "${env:GRAFANA_CLOUD_INSTANCE_ID}"
      password: "${env:GRAFANA_CLOUD_API_TOKEN}"

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Free tier allows 10k active metric series. `span_metrics` below multiplies
  # series by service x span name x route x method x status, which across 25
  # services reaches that ceiling quickly. Trim `dimensions` before raising
  # the plan - the overage is on the one quota that is not generous.
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    expected_new_traces_per_sec: 100
    policies:
      - name: errors-always
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: latency-over-500ms
        type: latency
        latency:
          threshold_ms: 500
      - name: baseline
        type: probabilistic
        probabilistic:
          sampling_percentage: 10

  batch:
    timeout: 5s
    send_batch_size: 1024

connectors:
  span_metrics:
    dimensions:
      - name: http.route
      - name: http.request.method
      - name: rpc.system
      - name: rpc.service
      - name: rpc.method

exporters:
  # One endpoint for all three signals. `otlphttp` appends `/v1/traces`,
  # `/v1/metrics` and `/v1/logs` to the configured base URL, so unlike the
  # self-hosted recipe there is no separate Tempo / Mimir / Loki exporter and
  # no `prometheusremotewrite` - Grafana Cloud's gateway fans out on its side.
  otlp_http/grafana_cloud:
    endpoint: "${env:GRAFANA_CLOUD_OTLP_ENDPOINT}"
    auth:
      authenticator: basicauth/grafana_cloud

service:
  extensions: [basicauth/grafana_cloud]
  pipelines:
    # Fan-out at the receiver so span_metrics sees every span. Downstream of
    # tail sampling it would follow the keep rate, biasing error rate toward
    # 100% - the kept population is mostly errors and slow traces by design.
    traces/metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [span_metrics]

    traces/cloud:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [otlp_http/grafana_cloud]

    metrics:
      receivers: [otlp, span_metrics]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/grafana_cloud]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/grafana_cloud]
